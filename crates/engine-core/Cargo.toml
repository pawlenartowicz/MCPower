[package]
name = "engine-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false           # internal engine crate — channels are PyPI/CRAN/GH/web, never crates.io

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
engine-contract = { path = "../engine-contract" }
# loop_advanced = the unstable scratch-explicit hot-path surface, outside glmm's
# semver guarantee, so the version is pinned exactly; any bump can move the GLMM
# goldens and must be deliberate and reviewed.
glmm = { version = "=0.6.2", default-features = false, features = ["loop_advanced"] }
rayon        = "1.10"
serde        = { version = "1", features = ["derive"] }
# Used only by bin/throughput.rs (baseline JSON read/write); already in the
# workspace tree via engine-contract, so this adds no new compilation unit.
serde_json   = "1"
thiserror    = "2"
thread_local = "1.1"

# Counter-based Philox4x32-10 core extracted from this crate (was src/philox.rs
# plus the splitmix64/u32_to_unit_f32 leaf helpers in rng.rs). Its output IS the
# reproducibility contract: philox4x32_10 / splitmix64 / u32_to_unit_f32 are
# byte-identical to the deleted local copies and golden_rng.rs pins the derived
# stream, so a version that moved any output bit would break the goldens. The
# 0.2.x line is frozen (KAT-pinned; 0.2.1 adds `fill_u32` and `key`, used by
# SimRng and fill_words), so patches inside it are safe; the caret stops below
# 0.3.0 so a minor bump is never picked up silently. default-features = false:
# the no_std, zero-dep core only, not the rand_core RngCore wrapper — keeps the
# dep graph minimal and wasm-clean.
rand_philox = { version = "0.2.1", default-features = false }

# Portable SIMD (x86 AVX/AVX-512, wasm simd128, NEON, scalar fallback) for the
# central-branch normal draw (`rng.rs` `CentralHornerOp`). Already in the tree
# transitively via faer and glmm; declared direct so engine-core can call it.
# That kernel is bit-identical to its scalar twin, so the pulp version cannot
# move its output. The version can move bits inside faer and glmm (instruction
# set or lane-width choice changes reduction order in the fit and the
# data-gen transcendentals); the lock files hold that, so a pulp move shows up
# as a lock diff.
pulp = "0.22"

# wasm32 target: drop faer's `rayon` feature (pulls spindle → atomic-wait, which
# has no wasm32 implementation) and `rand` (pulls rand 0.9 → getrandom 0.3, which
# requires the wasm_js backend shim). `std` and `linalg` cover everything
# engine-core actually uses: Mat/MatRef/MatMut, llt(), Solve, reborrow.
[target.'cfg(target_arch = "wasm32")'.dependencies]
faer         = { version = "0.24", default-features = false, features = ["std", "linalg"] }

# Non-wasm targets: keep faer's default features (std, rayon, rand, sparse-linalg, npy).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
faer         = "0.24"

[dev-dependencies]
engine-contract = { path = "../engine-contract", features = ["test-fixtures"] }
approx    = "0.5"
dhat      = "0.3"
libm      = "0.2"
