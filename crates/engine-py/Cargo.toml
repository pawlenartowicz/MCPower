[package]
name = "engine-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false           # PyO3 cdylib — shipped as a PyPI wheel, never crates.io

[lints]
workspace = true

[lib]
name = "_engine"
crate-type = ["cdylib"]

[features]
# `test-bridge` exposes the `panic_for_test` seam for Python tests. The
# release wheel must not enable it — keeping test-only symbols out of the
# public surface.
test-bridge = []

[dependencies]
engine-contract     = { path = "../engine-contract" }
engine-core         = { path = "../engine-core" }
engine-orchestrator = { path = "../engine-orchestrator" }
engine-spec-builder = { path = "../engine-spec-builder" }
pyo3                = { version = "0.29", features = ["extension-module", "abi3-py310"] }
rmp-serde           = "1"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
